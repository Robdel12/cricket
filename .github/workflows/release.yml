name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm install --frozen-lockfile
      # npm publish runs prepublishOnly (check and tests) before anything is pushed.
      - name: Bump version and publish
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          npm version --no-git-tag-version --allow-same-version ${TAG_NAME:1}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit --all --message "🔖 $TAG_NAME"
          git tag --force $TAG_NAME
          npm publish
          git push origin HEAD:main
          git push origin refs/tags/$TAG_NAME --force

  docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CRICKET_DOCS_VERSION: ${{ github.event.release.tag_name }}
      CRICKET_DOCS_PATH: ${{ vars.CRICKET_DOCS_PATH || '/cricket/' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
      - run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm install --frozen-lockfile
          pnpm docs:build
          node site/scripts/archive.js pack site/dist "$RUNNER_TEMP/release/cricket-docs-$CRICKET_DOCS_VERSION.tar.gz"
          node site/scripts/releases.js upload "$RUNNER_TEMP/release" "$CRICKET_DOCS_VERSION"
